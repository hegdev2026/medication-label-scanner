name: Set up Flutter
description: Java 17, the pinned Flutter SDK and `flutter pub get`.

inputs:
  flutter-version:
    description: >
      Exact Flutter version. The one place it is set for every workflow; keep it
      equal to `flutter --version` on your machine.
    required: false
    default: "3.41.6"

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: stable
        cache: true

    - name: flutter pub get
      shell: bash
      run: flutter pub get
