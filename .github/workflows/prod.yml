# Push or merge to `prod`: checks, then promote the latest closed-testing release
# to Google Play production. No rebuild: users get exactly what testers ran.
name: Prod to Play production

on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  promote:
    name: Promote closed-testing release to Play production
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Add required reviewers to this environment: it is the last gate before users.
    environment: play-production
    permissions:
      contents: write   # to tag the release at the end
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: android
      - name: Play service account
        env:
          PLAY_KEY: ${{ secrets.PLAY_STORE_JSON_KEY_DATA }}
        run: |
          set -euo pipefail
          test -n "$PLAY_KEY" || { echo "::error::PLAY_STORE_JSON_KEY_DATA is empty."; exit 1; }
          printf '%s' "$PLAY_KEY" > android/fastlane/play-service-account.json
          python3 -c "import json; json.load(open('android/fastlane/play-service-account.json'))"
      - name: Promote to production
        working-directory: android
        env:
          SUPPLY_JSON_KEY: ${{ github.workspace }}/android/fastlane/play-service-account.json
          RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          # Optional staged rollout: set the repo variable PLAY_ROLLOUT to 0.1 for 10%.
          ROLLOUT: ${{ vars.PLAY_ROLLOUT }}
        run: bundle exec fastlane android promote
      # Tag only after Play accepted the promotion, so a tag means "reached users".
      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="prod-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Production $TAG" \
            --notes "Promoted from Play closed testing to production."
